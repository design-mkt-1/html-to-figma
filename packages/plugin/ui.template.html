<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --fg: var(--figma-color-text, #1e1e1e);
        --fg-muted: var(--figma-color-text-secondary, #6b7280);
        --bg: var(--figma-color-bg, #ffffff);
        --border: var(--figma-color-border, #e5e7eb);
        --accent: var(--figma-color-bg-brand, #0d99ff);
        --danger: var(--figma-color-text-danger, #dc2626);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px;
        font:
          11px/1.5 Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
      }

      .sub {
        margin: 0 0 16px;
        color: var(--fg-muted);
      }

      #drop {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 128px;
        padding: 20px;
        border: 1.5px dashed var(--border);
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        transition:
          border-color 0.12s,
          background 0.12s;
      }

      #drop:hover,
      #drop.over {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 6%, transparent);
      }

      #drop strong {
        font-size: 12px;
        font-weight: 600;
      }

      #drop span {
        color: var(--fg-muted);
      }

      #file {
        display: none;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 16px 0;
      }

      label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        cursor: pointer;
      }

      label input {
        margin: 1px 0 0;
      }

      label .hint {
        display: block;
        color: var(--fg-muted);
      }

      #progress {
        display: none;
        height: 4px;
        margin-bottom: 8px;
        border-radius: 2px;
        background: var(--border);
        overflow: hidden;
      }

      #bar {
        width: 0;
        height: 100%;
        background: var(--accent);
        transition: width 0.15s ease-out;
      }

      #status {
        min-height: 16px;
        color: var(--fg-muted);
      }

      #status.error {
        color: var(--danger);
        white-space: pre-wrap;
      }

      #warnings {
        margin-top: 12px;
        max-height: 140px;
        overflow-y: auto;
      }

      .warn-title {
        margin-bottom: 6px;
        font-weight: 600;
      }

      .warn {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        padding: 5px 0;
        border-top: 1px solid var(--border);
        color: var(--fg-muted);
      }

      .count {
        flex: none;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>HTML to Figma</h1>
    <p class="sub">Drop a capture file made with <code>h2f capture</code>.</p>

    <div id="drop">
      <strong>Choose a capture file</strong>
      <span>or drag one here — .h2d.json or .h2d.gz</span>
    </div>
    <input id="file" type="file" accept=".json,.gz,.h2d,application/json,application/gzip" />

    <div class="options">
      <label>
        <input id="auto-layout" type="checkbox" checked />
        <span>
          Infer auto-layout
          <span class="hint"
            >Falls back to absolute positions wherever it would shift a layer.</span
          >
        </span>
      </label>
    </div>

    <div id="progress"><div id="bar"></div></div>
    <div id="status">Ready.</div>
    <div id="warnings"></div>

    <script>
      /* __H2F_UI_SCRIPT__ */
    </script>
  </body>
</html>
